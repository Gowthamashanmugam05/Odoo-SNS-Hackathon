<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Orange circles background -->
  <circle cx="100" cy="120" r="80" fill="#FF8C42" opacity="0.9"/>
  <circle cx="100" cy="100" r="75" fill="#FFA500"/>
  
  <!-- Blue earth -->
  <circle cx="100" cy="80" r="60" fill="#0052CC"/>
  
  <!-- Green continents -->
  <ellipse cx="75" cy="65" rx="20" ry="25" fill="#7FBA00"/>
  <ellipse cx="125" cy="65" rx="18" ry="22" fill="#7FBA00"/>
  <ellipse cx="100" cy="100" rx="22" ry="20" fill="#90EE90"/>
  
  <!-- White flight path -->
  <path d="M 50 85 Q 100 75 150 90" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Blue airplane -->
  <g transform="translate(145, 85)">
    <polygon points="0,-8 -5,8 5,8" fill="#0052CC"/>
    <path d="M -8 0 L 8 0" stroke="#0052CC" stroke-width="2"/>
  </g>
  
  <!-- Orange location pin -->
  <g transform="translate(50, 50)">
    <circle cx="0" cy="0" r="8" fill="#FF6B35"/>
    <circle cx="0" cy="0" r="5" fill="white"/>
  </g>
</svg>